services:

  qdrant:
    image: qdrant/qdrant:latest
    container_name: repopilot-qdrant

    ports:
      - "6333:6333"
      - "6334:6334"

    volumes:
      - qdrant_storage:/qdrant/storage


  api:
    build: .
    container_name: repopilot-api

    ports:
      - "8000:8000"

    env_file:
      - .env

    depends_on:
      - qdrant


volumes:
  qdrant_storage: